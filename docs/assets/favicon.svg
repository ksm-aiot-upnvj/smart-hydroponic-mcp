<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Background Gradients -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B0F19" />
            <stop offset="100%" stop-color="#1A1A2E" />
        </linearGradient>
        
        <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="100%" stop-color="#A3E635" />
        </linearGradient>

        <!-- Leaf Gradients (Nature + Tech) -->
        <linearGradient id="leafLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#A3E635" />
            <stop offset="100%" stop-color="#10B981" />
        </linearGradient>
        
        <linearGradient id="leafRight" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="100%" stop-color="#8B5CF6" />
        </linearGradient>

        <!-- Tech Accent Gradient -->
        <linearGradient id="circuitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00E5FF" />
            <stop offset="100%" stop-color="#007BFF" />
        </linearGradient>

        <!-- Glow Filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Background Rounded Rectangle (Favicon Base) -->
    <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />
    <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#borderGradient)" stroke-width="3" opacity="0.8" />

    <!-- Subtle Background Tech Grid -->
    <g stroke="#1E293B" stroke-width="2" opacity="0.6">
        <!-- Horizontal Lines -->
        <line x1="64" y1="128" x2="160" y2="128" />
        <line x1="352" y1="128" x2="448" y2="128" />
        <line x1="64" y1="384" x2="160" y2="384" />
        <line x1="352" y1="384" x2="448" y2="384" />
        <!-- Vertical Lines -->
        <line x1="128" y1="64" x2="128" y2="160" />
        <line x1="384" y1="64" x2="384" y2="160" />
        <line x1="128" y1="352" x2="128" y2="448" />
        <line x1="384" y1="352" x2="384" y2="448" />
    </g>

    <!-- Nodes for Background Tech Grid -->
    <g fill="#38BDF8" opacity="0.8">
        <circle cx="160" cy="128" r="5" />
        <circle cx="352" cy="128" r="5" />
        <circle cx="160" cy="384" r="5" />
        <circle cx="352" cy="384" r="5" />
        <circle cx="128" cy="160" r="5" />
        <circle cx="384" cy="160" r="5" />
        <circle cx="128" cy="352" r="5" />
        <circle cx="384" cy="352" r="5" />
    </g>

    <!-- Orbit Ring (Smart Technology Network) -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="4" />
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#circuitGlow)" stroke-width="2" stroke-dasharray="24 16" />
    <circle cx="256" cy="256" r="184" fill="none" stroke="#1E293B" stroke-width="2" />
    
    <!-- Data Connections to the Leaf -->
    <g stroke="#8B5CF6" stroke-width="3" opacity="0.9">
        <line x1="128" y1="256" x2="160" y2="256" />
        <circle cx="128" cy="256" r="6" fill="#8B5CF6" />
    </g>
    <g stroke="#10B981" stroke-width="3" opacity="0.9">
        <line x1="384" y1="256" x2="352" y2="256" />
        <circle cx="384" cy="256" r="6" fill="#10B981" />
    </g>

    <!-- MAIN ICON: Geometric Smart Leaf -->
    <g id="smart-leaf">
        <!-- Left Facets (Nature) -->
        <path d="M256 380 L160 256 L256 132 Z" fill="url(#leafLeft)" />
        <path d="M256 132 L180 180 L256 256 Z" fill="url(#leafLeft)" opacity="0.7" />
        <path d="M256 256 L180 332 L256 380 Z" fill="url(#leafLeft)" opacity="0.5" />

        <!-- Right Facets (Tech) -->
        <path d="M256 380 L352 256 L256 132 Z" fill="url(#leafRight)" />
        <path d="M256 132 L332 180 L256 256 Z" fill="url(#leafRight)" opacity="0.7" />
        <path d="M256 256 L332 332 L256 380 Z" fill="url(#leafRight)" opacity="0.5" />

        <!-- Central Vein (Highlights the fusion) -->
        <line x1="256" y1="140" x2="256" y2="372" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 6" opacity="0.8" />
        
        <!-- Leaf Outer Glow / Boundary -->
        <path d="M256 132 Q160 200 160 256 Q160 312 256 380 Q352 312 352 256 Q352 200 256 132 Z" fill="none" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)" opacity="0.4" />
    </g>

    <!-- Data Node Dots on Leaf -->
    <g fill="#FFFFFF" filter="url(#softGlow)">
        <circle cx="256" cy="160" r="4" />
        <circle cx="256" cy="352" r="4" />
        <circle cx="180" cy="256" r="4" />
        <circle cx="332" cy="256" r="4" />
    </g>

    <!-- CENTRAL CHIP (MCP Core) -->
    <g id="mcp-chip">
        <!-- Hexagon Base -->
        <polygon points="256,215 291,232.5 291,267.5 256,285 221,267.5 221,232.5" fill="rgba(0,0,0,0.6)" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)" />
        
        <!-- Inner Hexagon Detail -->
        <polygon points="256,222 283,235 283,265 256,278 229,265 229,235" fill="none" stroke="#00E5FF" stroke-width="1.5" />
        
        <!-- MCP Text on Chip -->
        <text x="256" y="258" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">M</text>
        
        <!-- Chip Pins (Connecting to the leaf veins) -->
        <line x1="221" y1="232.5" x2="200" y2="220" stroke="#FFFFFF" stroke-width="3" />
        <line x1="221" y1="267.5" x2="200" y2="280" stroke="#FFFFFF" stroke-width="3" />
        <line x1="291" y1="232.5" x2="312" y2="220" stroke="#FFFFFF" stroke-width="3" />
        <line x1="291" y1="267.5" x2="312" y2="280" stroke="#FFFFFF" stroke-width="3" />
    </g>

    <!-- TYPOGRAPHY (Logo Text) -->
    <g id="brand-text">
        <!-- Main Brand Name -->
        <text x="256" y="440" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="12">MCP</text>
        
        <!-- Subtitle -->
        <text x="256" y="475" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="8">SMART HYDROPONIC</text>
    </g>
</svg>