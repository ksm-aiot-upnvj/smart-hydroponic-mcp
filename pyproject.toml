[project]
name = "smart-hydroponic-mcp"
version = "1.1.2"
description = "Model Context Protocol (MCP) server for Smart Hydroponic system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "fastmcp>=3.4.2",
    "asyncpg>=0.30.0",
    "langchain>=1.3.4",
    "langchain-openai>=1.2.2",
    "mcp[cli]>=1.27.2",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.49.0",
    "zensical>=0.0.51",
]

[dependency-groups]
dev = [
    "python-semantic-release>=10.6.1",
    "ruff>=0.16.0",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
upload_to_release = true
upload_to_pypi = false
changelog_file = "CHANGELOG.md"
tag_format = "{version}"
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
"""
commit_message = "chore(release): bump to {version}"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_re = "(?i)^(feat)"
patch_re = "(?i)^(fix|perf|refactor)"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''Initial [Cc]ommit.*''',
]
